name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint the PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: php -l
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: Run the directory's own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: '.github'
